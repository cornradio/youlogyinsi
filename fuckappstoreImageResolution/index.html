<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>截图尺寸转换器</title>
  <style>
    :root {
      --bg-1: #f7efe5;
      --bg-2: #d9f0ff;
      --ink: #1f1b16;
      --panel: rgba(255, 255, 255, 0.82);
      --accent: #136f63;
      --accent-2: #0f4c81;
      --border: rgba(31, 27, 22, 0.14);
      --shadow: 0 14px 44px rgba(22, 27, 34, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 12%, rgba(19, 111, 99, 0.18), transparent 36%),
        radial-gradient(circle at 88% 82%, rgba(15, 76, 129, 0.18), transparent 34%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(920px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 28px;
      animation: rise 420ms ease;
    }

    @keyframes rise {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(22px, 4vw, 34px);
      letter-spacing: 0.5px;
    }

    p {
      margin: 0;
      line-height: 1.55;
      color: rgba(31, 27, 22, 0.82);
    }

    .sizes {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .size-group {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.72);
    }

    .size-group h3 {
      margin: 0 0 10px;
      font-size: 15px;
      color: rgba(31, 27, 22, 0.9);
    }

    .size-note {
      margin: -4px 0 10px;
      font-size: 12px;
      color: rgba(31, 27, 22, 0.62);
    }

    .size-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .sizes label {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.78);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 180ms ease, border-color 180ms ease;
      font-size: 15px;
    }

    .sizes label:hover {
      transform: translateY(-1px);
      border-color: rgba(19, 111, 99, 0.45);
    }

    .sizes label:has(input:checked) {
      border-color: rgba(19, 111, 99, 0.55);
      background: rgba(230, 255, 245, 0.72);
    }

    .size-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .size-main {
      font-variant-numeric: tabular-nums;
    }

    .orient {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .orient.portrait {
      color: #0d553f;
      background: rgba(19, 111, 99, 0.14);
    }

    .orient.landscape {
      color: #0f4c81;
      background: rgba(15, 76, 129, 0.14);
    }

    .orient.custom {
      color: #6b4f1d;
      background: rgba(180, 130, 40, 0.16);
    }

    .custom-fields {
      display: none;
      margin-top: 10px;
      gap: 10px;
      align-items: end;
      flex-wrap: wrap;
    }

    .custom-fields.show { display: flex; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 120px;
    }

    .field span {
      font-size: 12px;
      color: rgba(31, 27, 22, 0.68);
    }

    .field input {
      width: 140px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      background: #fff;
      color: var(--ink);
    }

    .field input:focus {
      outline: 2px solid rgba(19, 111, 99, 0.28);
      border-color: rgba(19, 111, 99, 0.45);
    }

    .dropzone {
      margin-top: 16px;
      border: 2px dashed rgba(15, 76, 129, 0.35);
      border-radius: 18px;
      min-height: 220px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 22px;
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.54), rgba(255, 255, 255, 0.8));
      transition: border-color 160ms ease, background-color 160ms ease;
      cursor: pointer;
      user-select: none;
    }

    .dropzone.dragover {
      border-color: var(--accent);
      background:
        linear-gradient(160deg, rgba(230, 255, 245, 0.86), rgba(221, 242, 255, 0.9));
    }

    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: rgba(31, 27, 22, 0.74);
    }

    .status {
      margin-top: 12px;
      min-height: 22px;
      font-size: 14px;
      color: #0d553f;
      font-weight: 600;
    }

    .status.error { color: #922; }

    .actions {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.03); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    @media (max-width: 740px) {
      .card { padding: 18px; border-radius: 18px; }
      .size-grid { grid-template-columns: 1fr; }
      .field input { width: 100%; }
      .field { min-width: calc(50% - 5px); flex: 1; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>截图尺寸一键转换</h1>
    <p>选择目标尺寸后，直接把图片拖进来（或点击区域选择文件）。上传后会自动转换并自动下载。已更新为 App Store Connect 当前 iPhone 6.1 / 6.3 英寸规格。</p>

    <section class="sizes" id="sizeOptions">
      <div class="size-group">
        <h3>iPhone 6.1 / 6.3 英寸（必填）</h3>
        <p class="size-note">Dynamic Island 中屏：1179×2556、1206×2622 及对应横屏</p>
        <div class="size-grid">
          <label>
            <input type="radio" name="size" value="1179x2556" checked />
            <span class="size-text">
              <span class="size-main">1179 × 2556</span>
              <span class="orient portrait">竖屏</span>
            </span>
          </label>
          <label>
            <input type="radio" name="size" value="2556x1179" />
            <span class="size-text">
              <span class="size-main">2556 × 1179</span>
              <span class="orient landscape">横屏</span>
            </span>
          </label>
          <label>
            <input type="radio" name="size" value="1206x2622" />
            <span class="size-text">
              <span class="size-main">1206 × 2622</span>
              <span class="orient portrait">竖屏</span>
            </span>
          </label>
          <label>
            <input type="radio" name="size" value="2622x1206" />
            <span class="size-text">
              <span class="size-main">2622 × 1206</span>
              <span class="orient landscape">横屏</span>
            </span>
          </label>
        </div>
      </div>

      <div class="size-group">
        <h3>iPad 12.9 英寸 / 13 英寸</h3>
        <div class="size-grid">
          <label>
            <input type="radio" name="size" value="2064x2752" />
            <span class="size-text">
              <span class="size-main">2064 × 2752</span>
              <span class="orient portrait">竖屏</span>
            </span>
          </label>
          <label>
            <input type="radio" name="size" value="2752x2064" />
            <span class="size-text">
              <span class="size-main">2752 × 2064</span>
              <span class="orient landscape">横屏</span>
            </span>
          </label>
          <label>
            <input type="radio" name="size" value="2048x2732" />
            <span class="size-text">
              <span class="size-main">2048 × 2732</span>
              <span class="orient portrait">竖屏</span>
            </span>
          </label>
          <label>
            <input type="radio" name="size" value="2732x2048" />
            <span class="size-text">
              <span class="size-main">2732 × 2048</span>
              <span class="orient landscape">横屏</span>
            </span>
          </label>
        </div>
      </div>

      <div class="size-group">
        <h3>自定义尺寸</h3>
        <div class="size-grid">
          <label>
            <input type="radio" name="size" value="custom" />
            <span class="size-text">
              <span class="size-main">手动输入宽高</span>
              <span class="orient custom" id="customOrientBadge">自定义</span>
            </span>
          </label>
        </div>
        <div class="custom-fields" id="customFields">
          <label class="field">
            <span>宽度 (px)</span>
            <input id="customW" type="number" min="1" step="1" placeholder="例如 1206" />
          </label>
          <label class="field">
            <span>高度 (px)</span>
            <input id="customH" type="number" min="1" step="1" placeholder="例如 2622" />
          </label>
        </div>
      </div>
    </section>

    <label class="dropzone" id="dropzone" for="picker" aria-label="拖拽图片到这里">
      <input id="picker" type="file" accept="image/*" multiple hidden />
      <div>
        <strong>拖拽图片到这里</strong><br />
        或点击这里选择图片
        <div class="hint">支持批量处理，默认使用等比缩放并填充留边（不拉伸、不裁剪）。iPhone 6.1/6.3 英寸截屏支持 1179×2556、1206×2622 及对应横屏。</div>
      </div>
    </label>

    <div class="actions">
      <button id="downloadAllBtn" disabled>再次下载最近结果</button>
    </div>

    <div class="status" id="status"></div>
  </main>

  <script>
    const dropzone = document.getElementById('dropzone');
    const picker = document.getElementById('picker');
    const statusNode = document.getElementById('status');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const customFields = document.getElementById('customFields');
    const customW = document.getElementById('customW');
    const customH = document.getElementById('customH');
    const customOrientBadge = document.getElementById('customOrientBadge');

    let recentBlobs = [];

    const orientLabel = (w, h) => {
      if (w === h) return '正方形';
      return w > h ? '横屏' : '竖屏';
    };

    const syncCustomUi = () => {
      const picked = document.querySelector('input[name="size"]:checked');
      const isCustom = picked && picked.value === 'custom';
      customFields.classList.toggle('show', isCustom);

      const w = Number(customW.value);
      const h = Number(customH.value);
      if (Number.isInteger(w) && Number.isInteger(h) && w > 0 && h > 0) {
        const label = orientLabel(w, h);
        customOrientBadge.textContent = label;
        customOrientBadge.className = 'orient ' + (label === '横屏' ? 'landscape' : label === '竖屏' ? 'portrait' : 'custom');
      } else {
        customOrientBadge.textContent = '自定义';
        customOrientBadge.className = 'orient custom';
      }
    };

    const getTargetSize = () => {
      const picked = document.querySelector('input[name="size"]:checked').value;
      if (picked === 'custom') {
        const w = Number(customW.value);
        const h = Number(customH.value);
        if (!Number.isInteger(w) || !Number.isInteger(h) || w <= 0 || h <= 0) {
          throw new Error('请先填写有效的自定义宽度和高度（正整数）');
        }
        return { w, h, label: `${w}x${h}`, orient: orientLabel(w, h) };
      }
      const [w, h] = picked.split('x').map(Number);
      return { w, h, label: picked, orient: orientLabel(w, h) };
    };

    const setStatus = (text, isError = false) => {
      statusNode.textContent = text;
      statusNode.classList.toggle('error', isError);
    };

    const fileToImage = (file) => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('图片读取失败'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('文件读取失败'));
      reader.readAsDataURL(file);
    });

    const renderToCanvas = (img, targetW, targetH) => {
      const canvas = document.createElement('canvas');
      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');

      // Use "contain" strategy so the full image is always visible.
      const scale = Math.min(targetW / img.width, targetH / img.height);
      const drawW = img.width * scale;
      const drawH = img.height * scale;
      const dx = (targetW - drawW) / 2;
      const dy = (targetH - drawH) / 2;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, targetW, targetH);
      ctx.drawImage(img, dx, dy, drawW, drawH);
      return canvas;
    };

    const canvasToBlob = (canvas) => new Promise((resolve, reject) => {
      canvas.toBlob((blob) => {
        if (!blob) {
          reject(new Error('导出失败'));
          return;
        }
        resolve(blob);
      }, 'image/png');
    });

    const downloadBlob = (blob, filename) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1200);
    };

    const buildName = (original, sizeLabel, orient, index = null) => {
      const dot = original.lastIndexOf('.');
      const base = dot > 0 ? original.slice(0, dot) : original;
      const serial = index !== null ? `_${String(index + 1).padStart(2, '0')}` : '';
      return `${base}_${sizeLabel}_${orient}${serial}.png`;
    };

    const processFiles = async (fileList) => {
      const files = Array.from(fileList).filter((f) => f.type.startsWith('image/'));
      if (files.length === 0) {
        setStatus('未检测到图片文件', true);
        return;
      }

      let target;
      try {
        target = getTargetSize();
      } catch (err) {
        setStatus(err.message || String(err), true);
        return;
      }

      const { w, h, label, orient } = target;
      setStatus(`处理中：${files.length} 张 -> ${label}（${orient}）...`);

      try {
        const blobs = [];
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const img = await fileToImage(file);
          const canvas = renderToCanvas(img, w, h);
          const blob = await canvasToBlob(canvas);
          const name = buildName(file.name, label, orient, files.length > 1 ? i : null);
          blobs.push({ blob, name });
          downloadBlob(blob, name);
        }

        recentBlobs = blobs;
        downloadAllBtn.disabled = false;
        setStatus(`完成：已自动下载 ${blobs.length} 张 (${label} · ${orient})`);
      } catch (err) {
        setStatus(`处理失败：${err.message || err}`, true);
      }
    };

    document.querySelectorAll('input[name="size"]').forEach((el) => {
      el.addEventListener('change', syncCustomUi);
    });
    customW.addEventListener('input', syncCustomUi);
    customH.addEventListener('input', syncCustomUi);
    syncCustomUi();

    picker.addEventListener('change', (e) => processFiles(e.target.files));

    ['dragenter', 'dragover'].forEach((evt) => {
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach((evt) => {
      dropzone.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('drop', (e) => processFiles(e.dataTransfer.files));

    downloadAllBtn.addEventListener('click', () => {
      if (recentBlobs.length === 0) return;
      for (const item of recentBlobs) {
        downloadBlob(item.blob, item.name);
      }
      setStatus(`已重新下载最近的 ${recentBlobs.length} 张图片`);
    });
  </script>
</body>
</html>
